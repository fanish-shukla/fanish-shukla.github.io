title: "Fanish Shukla"
description: "Solution Architect & Enterprise Architecture leader — Aviation focus"
url: "https://fanish.shukla.eu"

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "mint"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

markdown: kramdown
paginate: 5
paginate_path: /page:num/

# --- Author sidebar (left column: photo + contact) ---
# Upload your photo to assets/images/bio-photo.jpg
author:
  name: "Fanish Shukla"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Solution Architect, Enterprise Architecture. Former SWISS International Air Lines, Lufthansa Group EA team."
  location: "Zürich, Switzerland"
  links:
    - label: "fanishshukla"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/fanishshukla"
    - label: "fanish@.shukla.eu"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:fanish@.shukla.eu"
    - label: "+41782290666"
      icon: "fas fa-fw fa-phone-square"
      url: "tel:+41782290666"
    - label: "fanish-shukla"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/fanish-shukla"

footer:
  links:
    - label: "RSS"
      icon: "fas fa-fw fa-rss-square"
      url: "/feed.xml"

# --- Comments Configuration ---
comments:
  provider: "cusdis" # or "custom"

# --- Defaults applied to every blog post ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      toc: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

repository: "fanish-shukla/fanish-shukla.github.io"
