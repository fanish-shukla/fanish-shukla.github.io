title: "Fanish Shukla"
description: "CTO & Engineering Leader — scaling platforms, teams, and product outcomes"
url: "https://fanish.shukla.eu"
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "dirt"   # try: default, air, contrast, neon, dirt — pick one that feels senior/muted, not flashy

author:
  name: "Fanish Shukla"
  bio: "Senior Director / CTO focused on platform strategy, org scaling, and technical vision."
  location: "Zürich"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/fanishshukla"
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:fanish@shukla.eu"

footer:
  links:
    - label: "RSS"
      icon: "fas fa-fw fa-rss-square"
      url: "/feed.xml"

# --- This block is what gives every post the right-hand sidebar you want ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      sidebar:
        nav: "docs"        # optional left nav, remove if unwanted
      toc: true             # table of contents for long-form posts
      toc_sticky: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

repository: "fanish-shukla/yourusername.gitlab.io"