<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
</head>
<body>

  <header>
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <span style="font-size: 0.9rem; opacity: 0.8;">{{ site.tagline }}</span>
    </div>
  </header>

  <main class="container">
    <div class="grid-layout">
      <div class="main-content">
        {{ content }}
      </div>

      <aside class="sidebar">
        <div class="card">
          <h3>📡 Feeds & Subscriptions</h3>
          <ul class="feed-list">
            <li><a href="{{ '/feed.xml' | relative_url }}" target="_blank">🔗 RSS Feed</a></li>
            <li><a href="https://linkedin.com" target="_blank">💼 LinkedIn Profile</a></li>
          </ul>
        </div>

        <div class="card">
          <h3>📌 Topic Hub</h3>
          <ul class="feed-list">
            <li><a href="#">Enterprise Architecture</a></li>
            <li><a href="#">ArchiMate 3.0</a></li>
            <li><a href="#">Cloud Strategy</a></li>
            <li><a href="#">Aviation Systems</a></li>
          </ul>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("pre code.language-plantuml, pre code.language-puml").forEach(function (codeBlock) {
        let code = codeBlock.innerText.trim();
        
        // Clean and compress PlantUML via Kroki (eliminates ads & QR codes)
        const data = new TextEncoder().encode(code);
        const compressed = pako.deflate(data, { level: 9 });
        const base64 = btoa(String.fromCharCode.apply(null, compressed))
          .replace(/\+/g, '-').replace(/\//g, '_');

        const container = document.createElement("div");
        container.className = "plantuml-diagram";
        
        const img = document.createElement("img");
        img.src = "https://kroki.io/plantuml/svg/" + base64;
        img.alt = "ArchiMate Diagram";
        
        container.appendChild(img);
        const pre = codeBlock.parentNode;
        pre.parentNode.replaceChild(container, pre);
      });
    });
  </script>
</body>
</html>
