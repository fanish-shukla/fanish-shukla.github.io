<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Title -->
  <text x="350" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">ArchiMate Example: Serving Relationship</text>

  <!-- Business Service box -->
  <rect x="50" y="90" width="230" height="90" rx="18" ry="18" fill="#FFFFB2" stroke="#8a8a3c" stroke-width="1.5"/>
  <!-- service icon: small pill shape top-right -->
  <ellipse cx="255" cy="105" rx="10" ry="6" fill="none" stroke="#8a8a3c" stroke-width="1.3"/>
  <text x="165" y="130" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">Check-in Service</text>
  <text x="165" y="150" font-size="11" text-anchor="middle" fill="#555">(Business Service)</text>

  <!-- Business Actor box -->
  <rect x="420" y="90" width="220" height="90" rx="4" ry="4" fill="#FFFFB2" stroke="#8a8a3c" stroke-width="1.5"/>
  <!-- actor icon: simple stick figure top-right -->
  <circle cx="618" cy="103" r="5" fill="none" stroke="#8a8a3c" stroke-width="1.3"/>
  <line x1="618" y1="108" x2="618" y2="118" stroke="#8a8a3c" stroke-width="1.3"/>
  <line x1="611" y1="112" x2="625" y2="112" stroke="#8a8a3c" stroke-width="1.3"/>
  <line x1="618" y1="118" x2="612" y2="126" stroke="#8a8a3c" stroke-width="1.3"/>
  <line x1="618" y1="118" x2="624" y2="126" stroke="#8a8a3c" stroke-width="1.3"/>
  <text x="530" y="130" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">Passenger</text>
  <text x="530" y="150" font-size="11" text-anchor="middle" fill="#555">(Business Actor)</text>

  <!-- Serving relationship: solid line, open arrowhead -->
  <line x1="280" y1="135" x2="410" y2="135" stroke="#333" stroke-width="1.6" marker-end="url(#openArrow)"/>
  <text x="345" y="122" font-size="12" font-style="italic" text-anchor="middle" fill="#333">serving</text>

  <defs>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#333" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- Footer note -->
  <text x="350" y="230" font-size="11" text-anchor="middle" fill="#888">Check-in Service → serves → Passenger</text>
</svg>
